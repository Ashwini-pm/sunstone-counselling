<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sunstone · Faculty Assessment Center</title>
<style>
  :root{
    --red:#D6001C; --red-d:#a80016; --charcoal:#1f2230; --ink:#13151f;
    --slate:#556070; --line:#e6e7eb; --bg:#f4f5f7; --card:#fff;
    --green:#1E9E63; --amber:#E6A100; --muted:#646b79;
  }
  *{box-sizing:border-box}
  :focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px}
  .ic{flex:none;vertical-align:-3px}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  }
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .top{background:var(--charcoal);color:#fff;height:58px;padding:0 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:40}
  .logo{width:34px;height:34px;border-radius:8px;background:var(--red);display:grid;place-items:center;font-weight:800;font-size:18px}
  .top h1{font-size:16px;margin:0;font-weight:700;line-height:1.1}
  .top .tag{font-size:11px;color:#b9bcc6;letter-spacing:.04em}
  .spacer{flex:1}
  .modeswitch{display:flex;background:#33384a;border-radius:9px;padding:3px;font-size:13px}
  .modeswitch button{border:0;background:transparent;color:#c4c8d2;min-height:36px;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:600}
  .modeswitch button.on{background:#fff;color:var(--ink)}
  .wrap{max-width:1040px;margin:0 auto;padding:26px 22px 90px}
  h2{font-size:24px;margin:0 0 4px}
  .sub{color:var(--slate);font-size:14px;margin:0 0 22px;max-width:700px;line-height:1.5}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .pad{padding:22px}
  .btn{border:0;border-radius:9px;padding:10px 18px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--red);color:#fff} .btn.primary:hover{background:var(--red-d)}
  .btn.dark{background:var(--charcoal);color:#fff}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)} .btn.ghost:hover{background:#fafafa}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.lg{padding:13px 24px;font-size:15px}
  label.lab{display:block;font-size:12px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
  input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit}
  .field{margin-bottom:16px}
  .pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700}
  .pill.green{background:#e7f6ee;color:#15794b} .pill.amber{background:#fcf3dd;color:#9a6b00}
  .pill.red{background:#fbe7ea;color:#a80016} .pill.grey{background:#eef0f3;color:#5b6170}
  .pill.ai{background:#ece9fb;color:#5b3fb0}
  .note{background:#fff8e8;border:1px solid #f3e2b3;border-radius:10px;padding:11px 14px;font-size:13px;color:#7a5a00;margin:14px 0}
  /* role picker */
  .rolepick{display:flex;gap:14px;flex-wrap:wrap}
  .rolecard{flex:1;min-width:220px;border:1.5px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:.12s}
  .rolecard:hover{border-color:#cfd2da}
  .rolecard.sel{border-color:var(--red);box-shadow:0 0 0 3px rgba(214,0,28,.10)}
  .rolecard .ri{font-size:24px} .rolecard .rt{font-weight:800;margin-top:6px} .rolecard .rd{font-size:13px;color:var(--slate);margin-top:2px}
  /* stepper */
  .steps{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
  .step{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:11px;min-width:0}
  .step .n{font-weight:700;color:var(--muted)}
  .step.active{border-color:var(--red);box-shadow:0 0 0 2px rgba(214,0,28,.12)}
  .step.done{background:#f3fbf7;border-color:#bfe6d2}
  .step.done .n::after{content:" ✓";color:var(--green)}
  /* scenario card + visuals */
  .scenario{background:#fbfbfc;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .scenario .k{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .scenario .topic{font-size:17px;font-weight:700;margin:6px 0 0;line-height:1.4}
  .scenario .meta{font-size:13px;color:var(--slate);margin-top:8px}
  .scn-img{border-radius:11px;overflow:hidden;background:#eef0f3;line-height:0}
  .scn-img img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:11px}
  .imgph{width:100%;aspect-ratio:4/3;border:2px dashed #c7ccd6;border-radius:11px;display:grid;place-items:center;text-align:center;
    color:#5b6573;font-size:12px;line-height:1.7;background:#f1f3f7;padding:10px}
  .imgph b{color:#5b6170;font-size:12px}
  .vidwrap{position:relative;background:#0d0e14;border-radius:14px;overflow:hidden;aspect-ratio:16/10}
  .vidwrap video{width:100%;height:100%;object-fit:cover;display:block}
  .reclamp{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.55);
    color:#fff;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700}
  .reclamp .dot{width:9px;height:9px;border-radius:50%;background:#ff4d4d;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .vidtimer{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.55);color:#fff;padding:5px 11px;border-radius:8px;font-size:13px;font-variant-numeric:tabular-nums;font-weight:700}
  .vidoff{position:absolute;inset:0;display:grid;place-items:center;color:#7c8190;font-size:14px;text-align:center;padding:24px}
  .qflash{position:absolute;left:14px;right:14px;bottom:14px;background:rgba(255,255,255,.97);border-left:5px solid var(--red);
    border-radius:11px;padding:12px 15px;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:rise .35s ease}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .qflash .qwho{font-size:12px;font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:.04em}
  .qflash .qtx{font-size:15px;margin-top:2px;line-height:1.35}
  .qfeed .qi{border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13px;margin-bottom:8px;background:#fff}
  .qfeed .qi b{color:var(--red)}
  .controls{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .checkrow{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:14px 0}
  .checkrow input{margin-top:3px}
  textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font-family:inherit;font-size:13px;min-height:64px;margin-top:10px}
  /* evaluator */
  .evstation{margin-bottom:14px}
  .evhead{display:flex;align-items:center;gap:10px;cursor:pointer;padding:15px 18px}
  .evhead .ico{font-size:19px}.evhead .t{font-weight:700;flex:1}
  .evbody{padding:0 18px 18px;display:none}.evbody.open{display:block}
  .evgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:820px){.evgrid{grid-template-columns:1fr}}
  .evgrid video{width:100%;border-radius:11px;background:#0d0e14;aspect-ratio:16/10;object-fit:cover}
  .aibox{background:#f7f5fe;border:1px solid #e0d9f6;border-radius:11px;padding:14px 16px;margin-top:12px}
  .aibox-h{margin:0 0 8px;font-size:13px;font-weight:700;color:#5b3fb0;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
  .aibox ul{margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.6;color:#3f3a52}
  .rrow{display:grid;grid-template-columns:1fr 150px 38px;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .rrow .rn{font-size:13px;font-weight:600}.rrow .rn small{display:block;color:var(--muted);font-weight:400;font-size:11px}
  .rrow input[type=range]{width:100%}
  .rrow .rv{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  .rrow .ai{font-size:11px;color:#6a4ea8}
  .scorebig{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;color:#fff;text-align:center;flex:none}
  .scorebig b{font-size:30px;line-height:1}.scorebig small{font-size:11px;opacity:.85}
  .finalhead{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
  .empty{text-align:center;padding:48px 20px;color:var(--slate)}
  .kbd{font-size:12px;color:var(--muted)}
  .dl{font-size:12px;color:var(--red);text-decoration:none;font-weight:700}
  /* ---- single-station viewport-fit layout (no scroll at a station) ---- */
  .wrap--station{max-width:none;height:calc(100dvh - 58px);padding:14px 24px;overflow:hidden;display:flex;flex-direction:column;gap:10px}
  .st-head{flex:none}
  .st-title h2{font-size:20px;margin:6px 0 0;display:flex;align-items:center;gap:8px}
  .st-blurb{color:var(--slate);font-size:13px;margin:3px 0 0;max-width:980px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .st-main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.25fr;gap:20px}
  .st-brief{min-height:0;overflow-y:auto;background:#fbfbfc;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .st-brief .k{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .st-brief .topic{font-size:17px;font-weight:700;margin:6px 0 0;line-height:1.4}
  .st-brief .meta{font-size:13px;color:var(--slate)}
  .st-brief .scn-img{width:100%;margin:0 0 12px;border-radius:11px;overflow:hidden;background:#eef0f3;line-height:0}
  .st-brief .scn-img img{display:block;width:100%;max-height:30vh;object-fit:cover}
  .st-brief .imgph{aspect-ratio:auto;height:26vh;margin-bottom:12px}
  .st-feed{margin-top:14px}
  .st-rec{min-height:0;display:flex;flex-direction:column}
  .st-rec .vidwrap{flex:1;min-height:0;aspect-ratio:auto;margin:0}
  .st-rec .controls{flex:none}
  .progress{margin-bottom:2px}
  .pmeta{font-size:12px;font-weight:700;color:var(--slate);letter-spacing:.02em;margin-bottom:6px}
  .pbar{height:8px;background:#e9ebef;border-radius:999px;overflow:hidden}
  .pfill{height:100%;background:var(--red);border-radius:999px;transition:width .4s ease}
  .plan-area{min-height:150px}
  /* page transition overlay */
  #overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(31,34,48,.93);opacity:0;pointer-events:none;transition:opacity .25s ease}
  #overlay.show{opacity:1;pointer-events:auto}
  .ov-card{text-align:center;color:#fff}
  .spinner{width:42px;height:42px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ov-msg{font-size:16px;font-weight:600}
  @media(max-width:880px){
    .wrap--station{height:auto;overflow:visible;display:block;padding:18px 18px 80px}
    .st-main{grid-template-columns:1fr}
    .st-brief{overflow:visible}
    .st-rec .vidwrap{aspect-ratio:16/10}
    .st-rec{margin-top:16px}
  }
</style>
</head>
<body>
<div class="top">
  <div class="logo">S</div>
  <div>
    <h1>Faculty Assessment Center</h1>
    <div class="tag">SUNSTONE · ELEVATE — recruiting faculty for offline classes</div>
  </div>
  <div class="spacer"></div>
  <div class="modeswitch">
    <button id="m-cand" class="on" onclick="setMode('candidate')">Candidate</button>
    <button id="m-eval" onclick="setMode('evaluator')">Evaluator</button>
  </div>
</div>
<div class="wrap" id="app"></div>

<script>
/* ============ Shared rubrics (panel-only) & advisory AI blocks, keyed by step id ============ */
const RUBRIC={
  intro:[{key:"communication",name:"Communication & presence",hint:"On-camera clarity & warmth"},{key:"motivation",name:"Motivation to teach",hint:"Why they teach"},{key:"fit",name:"Fit for learner profile",hint:"Suits our students"}],
  teach:[{key:"mastery",name:"Subject mastery",hint:"Accuracy & depth"},{key:"clarity",name:"Teaching clarity",hint:"Easy to follow"},{key:"interruptions",name:"Handling interruptions",hint:"Doubts handled live"},{key:"pacing",name:"Structure & pacing",hint:"Build-up & timing"}],
  twoway:[{key:"adaptability",name:"Adaptability",hint:"Switches register"},{key:"audience",name:"Audience awareness",hint:"Reads the listener"},{key:"depth",name:"Depth on demand",hint:"Goes deeper well"}],
  doubt:[{key:"diagnosis",name:"Diagnosing confusion",hint:"Finds the real gap"},{key:"quality",name:"Explanation quality",hint:"Simple & concrete"},{key:"check",name:"Checking understanding",hint:"Confirms it landed"}],
  wrong:[{key:"accuracy",name:"Accuracy",hint:"Fixes the fact"},{key:"encouragement",name:"Encouragement",hint:"Protects confidence"},{key:"moment",name:"Teaching-moment creation",hint:"Teaches the whole class"}],
  difficult:[{key:"composure",name:"Composure",hint:"Calm, not defensive"},{key:"control",name:"Classroom control",hint:"Re-establishes order"},{key:"redirection",name:"Respectful redirection",hint:"No humiliation"}],
  dilemma:[{key:"empathy",name:"Empathy",hint:"Hears them out"},{key:"judgment",name:"Judgment",hint:"Practical & balanced"},{key:"escalation",name:"Escalation awareness",hint:"Knows when to refer"}],
  relevance:[{key:"relevance",name:"Relevance",hint:"Connects to real life"},{key:"employability",name:"Employability orientation",hint:"Ties to careers"},{key:"persuasion",name:"Persuasion",hint:"Wins them over"}],
  silent:[{key:"engagement",name:"Engagement",hint:"Gets a response"},{key:"confidence",name:"Confidence",hint:"Composed in silence"},{key:"activation",name:"Classroom activation",hint:"Energises the room"}],
  plan:[{key:"planning",name:"Planning",hint:"Clear plan"},{key:"prioritization",name:"Prioritization",hint:"Essentials first"},{key:"structure",name:"Teaching structure",hint:"Logical build-up"}],
  integrity:[{key:"integrity",name:"Integrity",hint:"Principled boundary"},{key:"judgment",name:"Professional judgment",hint:"Sound, fair call"}],
  reflect:[{key:"selfaware",name:"Self-awareness",hint:"Honest about performance"},{key:"coachability",name:"Coachability",hint:"Open to growth"}],
};
const AI={
  intro:{summary:"Clear and warm; gave a genuine teaching belief. Could connect more explicitly to first-gen / Tier-2-3 learners.",obs:["Spoke clearly at a good pace.","Stated a real belief, not clichés.","Learner-fit was implied more than stated."],scores:{communication:8,motivation:7,fit:7}},
  teach:{summary:"Strong opening and a usable example; handled the early doubts but the last one felt rushed.",obs:["Defined the idea before the formula.","Used a relatable, everyday example.","Momentum dipped after an interruption."],scores:{mastery:8,clarity:7,interruptions:6,pacing:6}},
  twoway:{summary:"Two clear registers; the simple version landed, the interview-level version could go deeper.",obs:["Plain language for the lost student.","Shifted tone deliberately between the two.","Advanced version stayed a bit surface-level."],scores:{adaptability:7,audience:7,depth:7}},
  doubt:{summary:"Found the root confusion and reframed it simply; did not fully confirm understanding.",obs:["Targeted the real misconception.","Jargon-light explanation.","Skipped a check-for-understanding."],scores:{diagnosis:8,quality:8,check:6}},
  wrong:{summary:"Corrected the error accurately and kindly; could have turned it into a class-wide teaching moment.",obs:["Fixed the fact precisely.","Did not embarrass the student.","Limited use for the whole class."],scores:{accuracy:8,encouragement:7,moment:7}},
  difficult:{summary:"Stayed calm and non-defensive, then redirected; no mention of a private word after class.",obs:["Did not match the aggression.","Re-engaged the class quickly.","No after-class follow-up mentioned."],scores:{composure:8,control:7,redirection:8}},
  dilemma:{summary:"Led with empathy and gave practical options; missed pointing to a counsellor or mentor.",obs:["Heard the student out first.","Offered real alternatives, not platitudes.","Did not flag formal support."],scores:{empathy:9,judgment:7,escalation:6}},
  relevance:{summary:"Tied the topic to careers and re-engaged with energy; leaned on assertion over example.",obs:["Connected the subject to real jobs.","Respected the student's view.","Could add one concrete proof-point."],scores:{relevance:7,employability:7,persuasion:7}},
  silent:{summary:"Stayed composed in the silence and tried to draw students in; the activation move could be sharper.",obs:["Did not panic or lecture over the silence.","Attempted to re-engage the room.","A pair-share or named, simpler question would land harder."],scores:{engagement:7,confidence:8,activation:6}},
  plan:{summary:"Clear, sequenced plan with sensible board use; the time felt optimistic for weak students.",obs:["Logical build-up from basics.","Specific about board content.","Underestimated time for the hard part."],scores:{planning:7,prioritization:6,structure:7}},
  integrity:{summary:"Held a firm, fair boundary without making it personal.",obs:["Declined the request clearly and fairly.","Framed it around fairness to all students.","Stayed professional under social pressure."],scores:{integrity:8,judgment:7}},
  reflect:{summary:"Honest, specific self-assessment with a concrete improvement.",obs:["Acknowledged what went well and what didn't.","Named a concrete change for a real classroom.","Showed openness to feedback."],scores:{selfaware:7,coachability:7}},
};
const INTRO_PROMPT="In about 90 seconds, tell us:<br>1. Who you are<br>2. What you teach<br>3. One belief that shapes how you teach<br><br>Then, why would you be a good fit for students who may be first-generation graduates, come from Tier-2/3 backgrounds, and use English as a second language?";
const DILEMMA_SCN="A student says: “Sir, I’m thinking of dropping out. My family wants me to start earning, and I feel guilty continuing my studies while they are struggling financially.”";
const REFLECT="In 30 seconds: (1) how do you think you performed today, and (2) one thing you would do differently in a real classroom?";

/* ============ Two roles ============ */
const ROLES={
  marketing:{ label:"MBA · Marketing", ico:"trend", sub:"Marketing Management",
    steps:[
      {id:"intro",type:"intro",title:"Intro & teaching philosophy",durationSec:120,blurb:"A short introduction to the hiring panel.",topic:INTRO_PROMPT},
      {id:"teach",type:"teach",title:"Micro-teaching + live doubts",durationSec:300,blurb:"Teach the topic as if you are teaching a first-year offline class. Student doubts will appear during the session — address them naturally and continue teaching.",
        topic:"Teach “Price Elasticity of Demand” using a real Indian example.",
        queries:[{at:40,who:"Priya",text:"If the price increases and people still buy it, does that mean demand is inelastic?"},{at:100,who:"Rahul",text:"Why are some products affected by price changes and others are not?"},{at:180,who:"Sneha",text:"Can you give one example from a brand we use every day?"}]},
      {id:"twoway",type:"twoway",title:"Explain it two ways",durationSec:180,blurb:"Explain the same concept twice. Adapt your explanation to the learner.",
        topic:"Explain “Market Segmentation”.<br><b>Part 1:</b> to a student who is completely lost.<br><b>Part 2:</b> to a student preparing for a marketing internship interview."},
      {id:"doubt",type:"scenario",title:"Doubt resolution",durationSec:120,blurb:"A student holds a misconception. Resolve it the way you would in class.",
        topic:"A student says: “Sir, marketing is basically selling, right?”",image:"step4-marketing.png"},
      {id:"wrong",type:"scenario",title:"The confident wrong answer",durationSec:120,blurb:"A student answers confidently — and incorrectly. Correct the concept without discouraging them.",
        topic:"You ask: “What is branding?” A student answers: “Branding is just the logo and tagline.”",image:"step5-marketing.png"},
      {id:"difficult",type:"scenario",title:"Difficult student",durationSec:120,blurb:"Respond as you would in a live classroom.",
        topic:"A student interrupts repeatedly and says: “Sir, all this sounds good in theory. How much of it have you actually done in industry?”",image:"step6.png"},
      {id:"dilemma",type:"scenario",title:"Student dilemma",durationSec:150,blurb:"Respond to the student as if they are sitting in front of you.",
        topic:DILEMMA_SCN,image:"step7.png"},
      {id:"relevance",type:"scenario",title:"Why should I study this?",durationSec:120,blurb:"A student questions the relevance of the subject.",
        topic:"A student says: “I don’t want a marketing job. Why do I need to learn this?”",image:"step8-marketing.png"},
      {id:"silent",type:"scenario",title:"Silent classroom",durationSec:120,blurb:"You ask a question and nobody responds.",
        topic:"You ask the class: “Can anyone give an example of good brand positioning?” Nobody responds. Students avoid eye contact. What do you do next?",image:"step9.png"},
      {id:"plan",type:"plan",title:"Lesson planning",durationSec:90,blurb:"You have 30 minutes with students who are weak in fundamentals. Write your lesson plan in the box, then record a short spoken explanation.",
        topic:"Topic: “The Marketing Funnel” — students have never heard the concept before.<br>Cover: how you would start · what examples you would use · what goes on the board · how you would check understanding.",notes:true},
      {id:"integrity",type:"scenario",title:"Integrity check",durationSec:120,blurb:"A professional judgment scenario.",
        topic:"A student asks you to increase his internal marks because his family has strong industry connections. What do you do?",image:"step11-marketing.png"},
      {id:"reflect",type:"reflect",title:"Reflection",durationSec:60,blurb:"A short reflection on how your session went.",topic:REFLECT},
    ]},
  java:{ label:"B.Tech CS · Java", ico:"code", sub:"Programming in Java",
    steps:[
      {id:"intro",type:"intro",title:"Intro & teaching philosophy",durationSec:120,blurb:"A short introduction to the hiring panel.",topic:INTRO_PROMPT},
      {id:"teach",type:"teach",title:"Micro-teaching + live doubts",durationSec:300,blurb:"Teach the topic as if you are teaching a first-year offline class. Student doubts will appear during the session — address them naturally and continue teaching.",
        topic:"Teach the “for loop” to first-year students who have recently learned variables.",
        queries:[{at:40,who:"Aditya",text:"How does the loop know when to stop?"},{at:110,who:"Neha",text:"What happens if I forget to update the counter variable?"},{at:180,who:"Karan",text:"When would I use a loop in a real program?"}]},
      {id:"twoway",type:"twoway",title:"Explain it two ways",durationSec:180,blurb:"Explain the same concept twice. Adapt your explanation to the learner.",
        topic:"Explain the difference between a Class and an Object.<br><b>Part 1:</b> to a student seeing programming for the first time.<br><b>Part 2:</b> to a student preparing for a technical interview."},
      {id:"doubt",type:"scenario",title:"Doubt resolution",durationSec:120,blurb:"A student holds a misconception. Resolve it the way you would in class.",
        topic:"A student says: “Sir, Java and JavaScript are basically the same thing, right?”",image:"step4-java.png"},
      {id:"wrong",type:"scenario",title:"The confident wrong answer",durationSec:120,blurb:"A student answers confidently — and incorrectly. Correct the concept without discouraging them.",
        topic:"You ask: “What makes a program correct?” A student answers: “If the code runs once without errors, it means the program is correct.”",image:"step5-java.png"},
      {id:"difficult",type:"scenario",title:"Difficult student",durationSec:120,blurb:"Respond as you would in a live classroom.",
        topic:"A student interrupts repeatedly and says: “Sir, everything you’re teaching is already available on YouTube.”",image:"step6.png"},
      {id:"dilemma",type:"scenario",title:"Student dilemma",durationSec:150,blurb:"Respond to the student as if they are sitting in front of you.",
        topic:DILEMMA_SCN,image:"step7.png"},
      {id:"relevance",type:"scenario",title:"Why should I study this?",durationSec:120,blurb:"A student questions the relevance of the subject.",
        topic:"A student says: “AI can already write code. Why do I need to learn Java?”",image:"step8-java.png"},
      {id:"silent",type:"scenario",title:"Silent classroom",durationSec:120,blurb:"You ask a question and nobody responds.",
        topic:"You ask the class: “When would you use an ArrayList instead of an Array?” Nobody responds. Students avoid eye contact. What do you do next?",image:"step9.png"},
      {id:"plan",type:"plan",title:"Lesson planning",durationSec:90,blurb:"You have 30 minutes with students who are weak in fundamentals. Write your lesson plan in the box, then record a short spoken explanation.",
        topic:"Topic: “Arrays vs ArrayList” — students struggle with programming basics.<br>Cover: how you would start · what examples you would use · what goes on the board · how you would check understanding.",notes:true},
      {id:"integrity",type:"scenario",title:"Integrity check",durationSec:120,blurb:"A professional judgment scenario.",
        topic:"A student asks you to share the coding test questions before the assessment. What do you do?",image:"step11-java.png"},
      {id:"reflect",type:"reflect",title:"Reflection",durationSec:60,blurb:"A short reflection on how your session went.",topic:REFLECT},
    ]},
};
// attach shared rubric + ai to every step
Object.values(ROLES).forEach(r=>r.steps.forEach(s=>{ s.rubric=RUBRIC[s.id]; s.ai=AI[s.id]; }));
const STEP_TITLES=ROLES.marketing.steps.map(s=>s.title);

/* ============ State ============ */
const state={mode:"candidate",stage:"welcome",role:null,idx:0,

let stream=null,recorder=null,chunks=[],tickTimer=null,stationElapsed=0,recording=false;
let firedQueries=new Set(),liveQueries=[],flashTimeout=null;
const STEPS=()=>state.role?ROLES[state.role].steps:[];

/* ============ Helpers ============ */

function fmt(s){const m=Math.floor(s/60),x=Math.floor(s%60);return String(m).padStart(2,"0")+":"+String(x).padStart(2,"0");}
function setMode(m){state.mode=m;$("#m-cand").classList.toggle("on",m==="candidate");$("#m-eval").classList.toggle("on",m==="evaluator");stopStream();render();}
/* ---- inline SVG icon set (replaces emoji; consistent, themeable, screen-reader-safe) ---- */

function icon(name,size=18){return `<svg class="ic" viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${ICON[name]||""}</svg>`;}
const STEP_ICON={intro:"user",teach:"cap",twoway:"swap",doubt:"bulb",wrong:"message",difficult:"zap",dilemma:"compass",relevance:"help",silent:"users",plan:"clipboard",integrity:"scale",reflect:"reflect"};
const ROLE_ICON={marketing:"trend",java:"code"};
function actKey(e,fn){if(e.key==="Enter"||e.key===" "){e.preventDefault();fn();}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
/* ---- transition overlay with messaging ---- */
const MSG_START=["Setting up your session…","Getting your first station ready…","Take a breath — here we go…"];
const MSG_NEXT=["Saving your response…","Got it — next one coming up…","Nice work. Loading the next station…","Response saved. Onto the next…"];
const MSG_SUBMIT=["Submitting your assessment…","Finalising your responses…","Wrapping things up…"];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function showOverlay(msg){let o=$("#overlay");if(!o){o=document.createElement("div");o.id="overlay";document.body.appendChild(o);}o.innerHTML=`<div class="ov-card"><div class="spinner"></div><div class="ov-msg">${msg}</div></div>`;o.classList.add("show");}
function hideOverlay(){const o=$("#overlay");if(o)o.classList.remove("show");}
function transition(msg,cb,delay=1100){showOverlay(msg);setTimeout(()=>{cb();hideOverlay();},delay);}
function imgFallback(el,file){const d=document.createElement("div");d.className="imgph";d.innerHTML=icon("image",30)+"<br><b>images/"+file+"</b><br><span>drop the generated image here</span>";el.replaceWith(d);}
function scnImg(file){return `<div class="scn-img"><img src="images/${file}" alt="Scenario illustration" onerror="imgFallback(this,'${file}')"></div>`;}

/* ============ Render root ============ */
function render(){
  const app=$("#app");
  const isStation=state.mode==="candidate"&&state.stage==="station";
  app.classList.toggle("wrap--station",isStation);
  if(state.mode==="evaluator"){app.innerHTML=renderEvaluator();return;}
  if(state.stage==="welcome")app.innerHTML=renderWelcome();
  else if(isStation){app.innerHTML=renderStation();initStation();}
  else app.innerHTML=renderDone();
}

/* ============ Welcome (role + consent) ============ */
function renderWelcome(){
  return `
  <h2>Faculty teaching assessment</h2>
  <p class="sub">A structured assessment center of ${STEP_TITLES.length} short stations. In each, you're given a task or scenario and your response is <b>recorded (video + audio)</b>. Afterwards, your recordings are reviewed by our panel with AI assistance for a final recommendation. ~40 minutes.</p>
  <div class="card pad" style="max-width:720px">
    <label class="lab" id="role-lab">1 · Select the role being assessed</label>
    <div class="rolepick" role="radiogroup" aria-labelledby="role-lab">
      ${Object.entries(ROLES).map(([k,r])=>`<div class="rolecard ${state.role===k?"sel":""}" role="radio" tabindex="0" aria-checked="${state.role===k}" onclick="pickRole('${k}')" onkeydown="actKey(event,()=>pickRole('${k}'))">
        <div class="ri">${icon(ROLE_ICON[k],24)}</div><div class="rt">${r.label}</div><div class="rd">${r.sub}</div></div>`).join("")}
    </div>
    <div class="field" style="margin-top:18px"><label class="lab" for="c-name">2 · Candidate name</label>
      <input id="c-name" type="text" placeholder="e.g. Dr. Suresh Iyer" value="${esc(state.candidate.name)}"></div>
    <div class="scenario">
      <div class="k">What to expect</div>
      <div style="font-size:14px;line-height:1.65;margin-top:6px;color:var(--ink)">
        <p style="margin:0 0 10px">A set of ${STEP_TITLES.length} short stations — about 40 minutes in total. Each one gives you a task or a real classroom situation. Some ask you to teach, some are conversations with students, and some ask how you'd respond on the spot.</p>
        <b>How to attempt</b>
        <ul style="margin:6px 0 0;padding-left:18px">
          <li>Read the prompt, then record your response on camera.</li>
          <li>Respond as if real students are in front of you — speak naturally.</li>
          <li>You can re-record a station, but you can't go back once you continue.</li>
          <li>There are no trick questions. Be yourself.</li>
        </ul>
      </div>
    </div>
    <label class="checkrow"><input type="checkbox" id="c-consent" ${state.candidate.consent?"checked":""}>
      <span>I understand this session records my video and audio to evaluate this teaching application, that an AI assistant will help analyse my responses, and that a human panel makes the final decision. I consent to this recording.</span></label>
    <div id="welcome-err" role="alert" style="color:var(--red);font-size:13px;font-weight:600;margin:0 0 10px;min-height:18px"></div>
    <button class="btn primary lg" onclick="startAssessment()">Begin assessment →</button>
    <p class="kbd" style="margin-top:10px">You'll be asked for camera + microphone access at the first station.</p>
  </div>`;
}
function pickRole(k){state.role=k;render();}
function startAssessment(){
  state.candidate.name=$("#c-name").value.trim()||"Candidate";
  state.candidate.consent=$("#c-consent").checked;
  const err=$("#welcome-err");
  if(!state.role){if(err)err.textContent="Please select the role being assessed.";return;}
  if(!state.candidate.consent){if(err)err.textContent="Please give recording consent to continue.";return;}
  transition(pick(MSG_START),()=>{state.stage="station";state.idx=0;render();});
}

/* ============ A station ============ */
function renderStation(){
  const steps=STEPS(),s=steps[state.idx],done=!!state.recordings[s.id];
  const total=steps.length, isTeach=s.type==="teach", hasImg=!!s.image, isPlan=!!s.notes, last=state.idx===total-1, left=total-state.idx-1;
  const taskLabel=isTeach?"Your topic":(s.type==="scenario"?"The situation":"Your task");
  const metaLine=isTeach?"Student doubts will appear on the video as you teach."
    :isPlan?"When you're done writing, turn on your camera and speak for about 1 minute to explain your plan."
    :"Respond to the camera as if the student is in front of you.";
  return `
  <div class="st-head">
    <div class="progress">
      <div class="pmeta">Station ${state.idx+1} of ${total}${left>0?" · "+left+" to go":" · final station"}</div>
      <div class="pbar"><div class="pfill" style="width:${Math.round((state.idx+1)/total*100)}%"></div></div>
    </div>
    <p class="st-blurb">${s.blurb}</p>
  </div>
  <div class="st-main">
    <div class="st-brief">
      ${hasImg?scnImg(s.image):""}
      <div class="k">${taskLabel}</div>
      <div class="topic">${s.topic}</div>
      ${isPlan?`<label class="lab" style="margin-top:14px">Your lesson plan</label>
        <textarea class="plan-area" placeholder="Write your lesson plan here…" oninput="state.planNotes['${s.id}']=this.value">${esc(state.planNotes[s.id])}</textarea>`:""}
      <div class="meta" style="margin-top:10px">${metaLine} · Recording limit ${fmt(s.durationSec)}.</div>
      ${isTeach?`<div class="st-feed"><label class="lab">Live student doubts</label>
        <div id="qfeed" class="qfeed"><div class="kbd">No doubts yet — they'll appear as you teach.</div></div></div>`:""}
    </div>
    <div class="st-rec">
      <div class="vidwrap">
        <video id="preview" autoplay muted playsinline></video>
        <div id="vidoff" class="vidoff">Camera off — click “Enable camera”.</div>
        <div id="reclamp" class="reclamp" style="display:none"><span class="dot"></span>REC</div>
        <div id="vidtimer" class="vidtimer" style="display:none">00:00</div>
        <div id="qflash"></div>
      </div>
      <div class="controls">
        <button id="b-enable" class="btn ghost" onclick="enableCamera()">Enable camera</button>
        <button id="b-rec" class="btn primary" onclick="toggleRec()" disabled>${icon("rec",13)} Start recording</button>
        <button id="b-redo" class="btn ghost" onclick="redo()" style="display:none">Re-record</button>
        <div style="flex:1"></div>
        <button id="b-next" class="btn dark" onclick="nextStation()" ${done?"":"disabled"}>${last?"Finish & submit →":"Save & next →"}</button>
      </div>
      <div id="camerr"></div>
      ${done?`<div class="note" style="margin:10px 0 0">✓ Recorded (${fmt(state.recordings[s.id].durationSec)}). Re-record or move on.</div>`:""}
    </div>
  </div>`;
}
function initStation(){stationElapsed=0;recording=false;firedQueries=new Set();liveQueries=[];
  if(stream){attachStream();$("#b-rec").disabled=false;$("#vidoff").style.display="none";$("#b-enable").style.display="none";}}
function attachStream(){const v=$("#preview");if(v&&stream)v.srcObject=stream;}
async function enableCamera(){
  $("#camerr").innerHTML="";
  try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});attachStream();
    $("#vidoff").style.display="none";$("#b-rec").disabled=false;$("#b-enable").style.display="none";
  }catch(e){$("#camerr").innerHTML=`<div class="note">Could not access camera/mic (<b>${e.name}</b>). On a real device the candidate grants permission here.
    <button class="btn ghost" style="margin-top:8px" onclick="simulateRec()">Continue without camera (demo)</button></div>`;}
}
function toggleRec(){recording?stopRec():startRec();}
function startRec(){
  if(!stream)return;chunks=[];recorder=new MediaRecorder(stream);
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  recorder.onstop=()=>{const blob=new Blob(chunks,{type:"video/webm"});state.recordings[STEPS()[state.idx].id]={url:URL.createObjectURL(blob),durationSec:stationElapsed,blob};};
  recorder.start();recording=true;stationElapsed=0;
  $("#reclamp").style.display="flex";$("#vidtimer").style.display="block";
  $("#b-rec").innerHTML=icon("stop",13)+" Stop recording";$("#b-rec").classList.remove("primary");$("#b-rec").classList.add("dark");
  $("#b-next").disabled=true;startTick();
}
function stopRec(){recording=false;try{recorder&&recorder.state!=="inactive"&&recorder.stop();}catch(e){}
  clearInterval(tickTimer);$("#reclamp")&&($("#reclamp").style.display="none");
  $("#b-rec")&&($("#b-rec").style.display="none");$("#b-redo")&&($("#b-redo").style.display="inline-block");
  $("#b-next")&&($("#b-next").disabled=false);$("#qflash")&&($("#qflash").innerHTML="");}
function startTick(){clearInterval(tickTimer);const s=STEPS()[state.idx];
  tickTimer=setInterval(()=>{stationElapsed++;const t=$("#vidtimer");if(t)t.textContent=fmt(stationElapsed)+" / "+fmt(s.durationSec);
    if(s.type==="teach"&&s.queries)s.queries.forEach(q=>{if(stationElapsed===q.at&&!firedQueries.has(q.at)){firedQueries.add(q.at);flashQuery(q);}});
    if(stationElapsed>=s.durationSec)stopRec();},1000);}
function flashQuery(q){liveQueries.push(q);const fl=$("#qflash");
  if(fl){fl.innerHTML=`<div class="qflash"><div class="qwho">${icon("hand",13)} ${q.who} asks</div><div class="qtx">${q.text}</div></div>`;
    clearTimeout(flashTimeout);flashTimeout=setTimeout(()=>{$("#qflash")&&($("#qflash").innerHTML="");},9000);}
  const feed=$("#qfeed");if(feed)feed.innerHTML=liveQueries.map(x=>`<div class="qi"><b>${x.who}:</b> ${x.text}</div>`).join("");}
function simulateRec(){state.recordings[STEPS()[state.idx].id]={url:null,durationSec:Math.round(STEPS()[state.idx].durationSec*0.7),blob:null,simulated:true};render();}
function redo(){delete state.recordings[STEPS()[state.idx].id];render();}
function nextStation(){if(recording)stopRec();const steps=STEPS();
  if(state.idx<steps.length-1){transition(pick(MSG_NEXT),()=>{state.idx++;render();});}
  else{transition(pick(MSG_SUBMIT),()=>{stopStream();state.stage="done";render();},1400);}}
function stopStream(){try{clearInterval(tickTimer);}catch(e){}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}

/* ============ Done ============ */
function renderDone(){return `
  <div class="card pad" style="text-align:center;max-width:620px;margin:30px auto">
    <div style="color:var(--green);margin-bottom:4px">${icon("check",46)}</div><h2 style="margin-top:8px">Assessment submitted</h2>
    <p class="sub" style="margin:8px auto 18px">Thank you, ${esc(state.candidate.name)}. All ${STEPS().length} stations are recorded for the <b>${ROLES[state.role].label}</b> role. Our panel and AI assistant will review your responses and you'll hear back with the next step.</p>
    <p class="kbd">Reviewing this candidate? Switch to <b>Evaluator</b> mode (top right).</p>
  </div>`;}

/* ============ Evaluator ============ */
function recordedCount(){return STEPS().filter(s=>state.recordings[s.id]).length;}
function renderEvaluator(){
  if(!state.role||recordedCount()===0){
    return `<h2>Evaluator — candidate review</h2>
    <p class="sub">Score recorded responses against each station's rubric, with AI assistance, for a final recommendation.</p>
    <div class="card empty">No candidate session yet. Switch to <b>Candidate</b> mode, pick a role, run the stations, then return here.</div>`;}
  const f=computeFinal();
  return `
  <h2>Evaluator — ${esc(state.candidate.name)||"Candidate"}</h2>
  <p class="sub">${ROLES[state.role].label} · ${recordedCount()}/${STEPS().length} stations recorded. Review each recording, adjust the AI's suggested scores, add notes — the recommendation updates live.</p>
  <div class="card pad" style="margin-bottom:22px">
    <div class="finalhead">
      <div class="scorebig" style="background:${f.color}"><div><b>${f.overall}</b><small>/100</small></div></div>
      <div style="flex:1;min-width:240px">
        <div style="font-size:18px;font-weight:800">${esc(state.candidate.name)||"Candidate"}</div>
        <div style="color:var(--slate);font-size:13px;margin:3px 0 10px">${ROLES[state.role].label}</div>
        <span class="pill ${f.cls}">Recommendation: ${f.label}</span>
        <span class="pill ai">AI avg ${f.aiAvg.toFixed(1)}</span>
        <span class="pill grey">Human avg ${f.humanAvg.toFixed(1)}</span>
        <p class="kbd" style="margin:10px 0 0">Final = human panel scores. AI scores are advisory. ${f.gap}</p>
      </div>
    </div>
  </div>
  ${STEPS().map(s=>renderEvalStation(s)).join("")}
  <p class="kbd" style="margin-top:18px">Prototype note: AI analysis is <b>illustrative</b>. In production it is produced by an LLM (and vision model) over each recording's transcript + video, with quoted, timestamped evidence.</p>`;
}
function renderEvalStation(s){
  const rec=state.recordings[s.id],open=state.openEval===s.id,sc=state.scores[s.id]||{};
  if(!rec)return `<div class="card evstation"><div class="evhead" style="cursor:default"><span class="ico">${icon(STEP_ICON[s.id],18)}</span><span class="t">${s.title}</span><span class="pill grey">Not recorded</span></div></div>`;
  return `<div class="card evstation">
    <div class="evhead" role="button" tabindex="0" aria-expanded="${open}" onclick="toggleEval('${s.id}')" onkeydown="actKey(event,()=>toggleEval('${s.id}'))">
      <span class="ico">${icon(STEP_ICON[s.id],18)}</span><span class="t">${s.title}</span>
      <span class="pill grey">${fmt(rec.durationSec)}</span>
      <span class="pill ${stationCls(s)}">${stationAvg(s).toFixed(1)}/10</span>
      <span class="kbd">${icon(open?"chevron-up":"chevron-down",16)}</span>
    </div>
    <div class="evbody ${open?"open":""}">
      <div class="evgrid">
        <div>
          ${rec.simulated?`<div class="vidoff" style="position:static;background:#0d0e14;border-radius:11px;aspect-ratio:16/10;color:#7c8190">Recording captured on candidate device<br>(playback unavailable in this demo run)</div>`
            :`<video src="${rec.url}" controls></video><div style="margin-top:6px"><a class="dl" href="${rec.url}" download="${s.id}.webm">${icon("download",13)} Download clip</a></div>`}
          <div class="scenario" style="margin-top:12px">
            <div class="k">${s.type==="teach"?"Topic given":(s.type==="scenario"?"Scenario":"Task")}</div>
            ${s.image?`<div class="scn-img" style="width:100%;margin:8px 0">${`<img src="images/${s.image}" alt="" onerror="imgFallback(this,'${s.image}')">`}</div>`:""}
            <div style="font-size:14px;margin-top:5px;line-height:1.45">${s.topic}</div>
            ${state.planNotes[s.id]?`<div class="note" style="margin-top:10px"><b>Candidate plan notes:</b><br>${esc(state.planNotes[s.id])}</div>`:""}
          </div>
        </div>
        <div>
          <div class="aibox"><div class="aibox-h">${icon("ai",14)} AI analysis — advisory</div>
            <div style="font-size:13px;line-height:1.5;color:#3f3a52">${s.ai.summary}</div>
            <ul>${s.ai.obs.map(o=>`<li>${o}</li>`).join("")}</ul></div>
          <label class="lab" style="margin:16px 0 4px">Panel scoring</label>
          ${s.rubric.map(r=>{const v=sc[r.key]!=null?sc[r.key]:s.ai.scores[r.key];
            return `<div class="rrow"><div class="rn" id="rl-${s.id}-${r.key}">${r.name}<small>${r.hint}</small></div>
              <div><input type="range" min="1" max="10" value="${v}" data-st="${s.id}" data-k="${r.key}" aria-labelledby="rl-${s.id}-${r.key}" oninput="setScore(this)"><div class="ai">AI suggested: ${s.ai.scores[r.key]}</div></div>
              <div class="rv" id="rv-${s.id}-${r.key}">${v}</div></div>`;}).join("")}
          <textarea placeholder="Panel notes for this station…" oninput="state.notes['${s.id}']=this.value">${esc(state.notes[s.id])}</textarea>
        </div>
      </div>
    </div></div>`;
}
function stationScores(s){const sc=state.scores[s.id]||{};return s.rubric.map(r=>sc[r.key]!=null?sc[r.key]:s.ai.scores[r.key]);}
function stationAvg(s){const a=stationScores(s);return a.reduce((x,y)=>x+y,0)/a.length;}
function stationCls(s){const v=stationAvg(s);return v>=7.5?"green":v>=6?"amber":"red";}
function computeFinal(){
  const recs=STEPS().filter(s=>state.recordings[s.id]);let human=[],ai=[];
  recs.forEach(s=>{human=human.concat(stationScores(s));ai=ai.concat(s.rubric.map(r=>s.ai.scores[r.key]));});
  const humanAvg=human.reduce((a,b)=>a+b,0)/human.length,aiAvg=ai.reduce((a,b)=>a+b,0)/ai.length;
  const overall=Math.round(humanAvg*10);let label,cls,color;
  if(overall>=78){label="Strong hire";cls="green";color="var(--green)";}
  else if(overall>=66){label="Proceed to next round";cls="green";color="var(--green)";}
  else if(overall>=52){label="Borderline — discuss";cls="amber";color="var(--amber)";}
  else{label="Do not proceed";cls="red";color="var(--red)";}
  const d=humanAvg-aiAvg,gap=Math.abs(d)<0.4?"Panel and AI broadly agree.":(d>0?"Panel scored higher than the AI.":"Panel scored lower than the AI.");
  return {overall,label,cls,color,humanAvg,aiAvg,gap};
}
function toggleEval(id){state.openEval=state.openEval===id?null:id;render();}
function setScore(el){const st=el.dataset.st,k=el.dataset.k;state.scores[st]=state.scores[st]||{};state.scores[st][k]=+el.value;
  $("#rv-"+st+"-"+k).textContent=el.value;const f=computeFinal();const b=$(".scorebig");if(b){b.style.background=f.color;b.innerHTML=`<div><b>${f.overall}</b><small>/100</small></div>`;}}

/* ============ boot ============ */
render();
</script>
</body>
</html>
